# ════════════════════════════════════════════════════════════════════════════
#  Assistant CYU — configuration
# ════════════════════════════════════════════════════════════════════════════
#
#  Copie ce fichier en `config.yaml` et remplis-le :
#
#      cp config.example.yaml config.yaml
#
#  `config.yaml` contient des mots de passe. Il est dans .gitignore : il ne
#  part JAMAIS sur GitHub. Ce fichier-ci, l'exemple, est fait pour y aller.
#
#  Tout ce qui est absent de ton config.yaml prend la valeur qu'il a ici :
#  tu peux donc n'y mettre que les trois secrets et laisser tout le reste.
#
# ════════════════════════════════════════════════════════════════════════════


# ─── Discord ────────────────────────────────────────────────────────────────
discord:

  # Portail developpeur Discord > ton application > Bot > Reset Token.
  bot_token: ""

  # La categorie qui contient les salons de l'assistant.
  # Clic droit sur la categorie > Copier l'identifiant (mode developpeur).
  # Sert uniquement a `python assistant.py salons`, qui cree les salons.
  categorie_id: ""

  # Facultatif. Vide = le bot publie ses commandes sur tous les serveurs ou il
  # se trouve. Ne remplis que si tu veux le limiter a un seul serveur.
  serveur_id: ""

  # Qui est mentionne sur les alertes vraiment urgentes.
  mention: ""
  mentions_actives: true

  # Filet de securite : tout salon laisse vide ci-dessous atterrit ici.
  # Une URL de webhook marche sans bot et sans aucune permission.
  webhook_secours: ""

  # ── Les salons ────────────────────────────────────────────────────────────
  #
  # Un salon par type de message : tu regles les notifications Discord
  # separement pour chacun (annonces en « tout », logs en muet).
  #
  # Mets un IDENTIFIANT DE SALON (que des chiffres, clic droit > Copier
  # l'identifiant) ou une URL DE WEBHOOK. Vide = webhook_secours.
  #
  # Deux salons peuvent partager la meme valeur, et
  # `python assistant.py salons` les cree tous et ecrit les identifiants ici
  # tout seul si tu preferes.
  salons:

    # Briefing du matin, briefing du soir, recap du dimanche.
    annonces: ""

    # Le tableau de l'emploi du temps de la semaine, remis a jour tout seul
    # dans un seul et meme message. Les changements sans urgence aussi.
    edt: ""

    # Echeances, relance de fin de journee, carnet de devoirs.
    devoirs: ""

    # Cours annule ou deplace qui touche aujourd'hui ou demain, panne CELCAT.
    # C'est le seul salon qui te mentionne.
    alertes: ""

    # Un unique message d'etat, reecrit en permanence : prochain cours,
    # fraicheur des donnees, webmail, devoirs en attente, uptime du bot.
    statut: ""

    # Ton salon fourre-tout : c'est la que tu tapes tes commandes, et la que
    # l'assistant epingle son panneau de boutons.
    commandes: ""

    # Demarrages, erreurs, heartbeats. A mettre en muet.
    logs: ""

    # Le jeu des predictions de la promo : /parier y poste chaque prediction
    # (une carte avec ses boutons de vote, comme un sondage), et le dimanche
    # le bot y rappelle celles qu'il reste a trancher, avec le classement.
    # Un IDENTIFIANT DE SALON obligatoirement, pas un webhook : les cartes
    # ont des boutons, et un webhook ne sait pas en porter. Vide = les
    # predictions restent la ou on tape la commande.
    predictions: ""


# ─── CYU : CELCAT et webmail ────────────────────────────────────────────────
cyu:

  # CELCAT n'est pas derriere le SSO casse du webmail : c'est un formulaire
  # LDAP classique, un script peut s'y connecter.
  user: ""
  password: ""

  celcat_base: "https://celcat-calendar.cyu.fr"

  # Le `fid0=` de ton URL CELCAT (/cal?...&fid0=12345678).
  federation_id: ""

  # Le `et=` de la meme URL. 104 = etudiant.
  res_type: "104"

  # Jours regardes en avant. Large volontairement : c'est ce qui permet de
  # voir l'emploi du temps APPARAITRE, donc il faut regarder la ou il n'y a
  # encore rien.
  horizon_jours: 28

  # Le webmail surveille par uptime.py.
  webmail_url: "https://mail.etu.cyu.fr/mail"
  webmail_intervalle: 60      # secondes entre deux essais
  webmail_heartbeat: 60       # recap dans #logs tous les N essais (~1 h)


# ─── Toi ────────────────────────────────────────────────────────────────────
moi:
  # Sert a calculer l'heure de lever conseillee dans le briefing du soir.
  trajet_minutes: 45
  preparation_minutes: 30

  # Bornes d'une journee type : la grille de l'emploi du temps et le calcul
  # des creneaux libres s'arretent la.
  journee_debut: "08:00"
  journee_fin: "19:00"


# ─── Quand etre prevenu ─────────────────────────────────────────────────────
notifications:

  # Le briefing du matin : toute la journee d'un coup.
  briefing_matin: "07:00"

  # Les jours ou ce briefing part. 0 = lundi ... 6 = dimanche.
  # [0, 1, 2, 3, 4] = en semaine seulement. Liste vide = tous les jours.
  briefing_matin_jours: []

  # Le briefing du soir : demain, l'heure de lever, les echeances.
  briefing_soir: "20:00"

  # Le recap de la semaine. jour : 0 = lundi ... 6 = dimanche.
  recap_semaine_jour: 6
  recap_semaine_heure: "18:00"

  # RAPPELS AVANT CHAQUE COURS — vide par defaut, et c'est voulu : les deux
  # briefings suffisent, un rappel par cours finit par etre du bruit.
  # Si tu en veux quand meme : [20] pour un rappel 20 min avant.
  avant_cours_minutes: []

  # Un seul rappel, pour le PREMIER cours de la journee seulement, sans les
  # suivants. Mets un nombre de minutes (45) pour l'activer, null pour non.
  # C'est le bon compromis si tu veux etre pousse a partir de chez toi.
  premier_cours_minutes: null

  # Avec avant_cours_minutes, ne rappelle que le premier cours d'un bloc qui
  # s'enchaine, au lieu de sonner a chaque intercours.
  seulement_premier_du_bloc: true

  # « tu as eu Algo et Anglais, des devoirs a noter ? », les jours ou tu as
  # eu cours. Deux facons de choisir le moment :
  #   * relance_devoirs_heure : une heure fixe ("18:00"), quoi qu'il arrive ;
  #   * laisse-la vide et c'est relance_devoirs_apres_minutes qui decide,
  #     compte a partir de la fin de ton dernier cours de la journee.
  relance_devoirs: true
  relance_devoirs_heure: ""
  relance_devoirs_apres_minutes: 20

  # Echeances rappelees dans le briefing du soir, en jours restants.
  devoirs_jours_avant: [7, 3, 1, 0]

  # Frequence de verification de l'emploi du temps, en minutes.
  verif_edt_minutes: 15

  # Frequence de reecriture du message de statut et du tableau EDT, en minutes.
  # Discord limite les modifications de message : ne descends pas sous 5.
  rafraichir_tableaux_minutes: 10

  # Ne rien envoyer entre ces deux heures, sauf les alertes urgentes.
  # Mets `null` a l'une des deux pour desactiver.
  silence_de: "23:00"
  silence_a: "06:30"

  # Etre mentionne des qu'un cours bouge (deplace, annule, salle changee),
  # et pas seulement quand ca touche aujourd'hui ou demain.
  # false = mention uniquement pour ce qui est urgent.
  ping_changements: true


# ─── Affichage ──────────────────────────────────────────────────────────────
affichage:
  # Un trou dans la journee n'est signale qu'a partir de cette duree.
  trou_minutes: 45

  # Un creneau libre n'est propose qu'a partir de cette duree.
  creneau_libre_minutes: 60

  # La grille de la semaine en barres. false = juste une liste par jour.
  grille_semaine: true

  # Colorise la grille (bleu CM, vert TD, rouge examen...). Si tu vois des
  # codes du genre [0;34m au lieu de couleurs, passe a false.
  grille_couleurs: true

  # Nombre de jours affiches par la grille de la semaine (5 = lun-ven).
  grille_jours: 5

  # ── Les images ────────────────────────────────────────────────────────────
  # L'assistant repond en PHOTO partout ou c'est plus lisible : la journee, la
  # semaine (les jours a la verticale), les changements, les devoirs.
  # Sans Pillow installe, tout retombe tout seul sur le texte.
  images: true

  # Le salon #edt contient l'image de la semaine, reecrite sur place (donc
  # sans jamais notifier). false = le tableau en texte, comme avant.
  tableau_edt_image: true

  # Les briefings du matin et du soir arrivent avec la photo de la journee.
  briefing_image: true


# ─── La meteo ───────────────────────────────────────────────────────────────
# Sert a deux choses, et deux seulement : savoir s'il faut un parapluie a
# l'heure ou tu sors, et partir un peu plus tot quand il pleut.
#
# Source : Open-Meteo. NI compte NI cle d'API : rien a remplir, rien qui
# expire. Les coordonnees ci-dessous sont celles de Cergy.
meteo:
  active: true

  # Ou tu es le matin. Coordonnees decimales (clic droit sur Google Maps >
  # le premier element du menu copie « 49.0362, 2.0631 »).
  latitude: 49.0362
  longitude: 2.0631
  lieu: "Cergy"

  # La meteo dans le briefing du matin et sur l'image de la journee.
  dans_le_briefing: true

  # En dessous de ce cumul sur une heure (en mm), il pleut sans que ca se
  # remarque : inutile d'annoncer un parapluie pour 0.1 mm.
  seuil_pluie: 0.2

  # Minutes ajoutees au trajet conseille quand il pleut a l'heure du depart.
  # Mets 0 si tu preferes que la meteo ne touche jamais a ton heure de depart.
  marge_pluie_minutes: 10

  # Le bulletin n'est pas redemande plus souvent que ca (minutes). Une
  # prevision horaire ne change pas toutes les trois minutes.
  cache_minutes: 30


# ─── La promo ───────────────────────────────────────────────────────────────
# Ce qui fait du serveur la plateforme de la classe, et pas seulement ton
# agenda : les anniversaires, les sondages, les rappels, et les examens qui
# deviennent des evenements Discord. Rien ici n'est obligatoire.
classe:

  # /anniversaire pour donner le sien. Le bot souhaite dans #annonces, a
  # cette heure-la, en mentionnant la personne. false = pas d'anniversaires.
  anniversaires: true
  anniversaires_heure: "08:00"

  # Chaque examen connu (CELCAT ou carnet) devient un EVENEMENT DISCORD : le
  # bandeau « evenements » en haut du serveur, la cloche « interesse », et le
  # rappel que Discord envoie tout seul. Mis a jour toutes les heures, et
  # retire si l'examen disparait. Le bot doit avoir « Gerer les evenements ».
  evenements_examens: true
  evenements_horizon_jours: 60

  # La duree par defaut d'un sondage (/sondage), en heures : 1 a 768.
  sondage_duree_heures: 24
  # Quand un sondage du bot se termine, il poste le resultat en reponse.
  sondage_resultats: true

  # Le dimanche, a l'heure du recap (recap_semaine_*), dans #predictions :
  # les predictions qu'il reste a trancher, et le classement.
  recap_predictions: true


# ─── Matieres ───────────────────────────────────────────────────────────────
#
# Pour relier un devoir a un cours quand les intitules ne collent pas.
# Le rattachement marche deja tout seul quand le nom est contenu dans le
# module ou le titre du cours ("maths" trouve "MATH101", le pluriel est gere).
# N'ajoute ici que les cas ou ca ne suffit pas :
#
#   matieres:
#     anglais: ["LANG201", "english"]
#     projet:  ["PROJ100", "integrateur"]
#
matieres: {}
